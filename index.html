<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0d1117">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flora Group Careers</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#F8F6F1;--card:#fff;--ink:#2A2318;--mut:#6A6254;--line:#E7E3DA;--acc:#86693E;--accbg:#F1E9D8;--onacc:#fff;--warn:#5E584E;--warnbg:#ECEAE6;--dang:#A32D2D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
h1,h2,h3{margin:0;font-weight:500;line-height:1.25}
h1{font-size:clamp(26px,5vw,38px)}h2{font-size:20px;margin:28px 0 12px}h3{font-size:16px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 48px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.logo{height:40px;width:auto;display:block;}
.sub{color:var(--mut);font-weight:400}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbl{font-size:13px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;font-size:14px}
.seg button.on{background:var(--acc);color:var(--onacc)}
.note{font-size:13px;color:var(--mut);padding:8px 0}
.hero{padding:36px 0 8px}.hero p{color:var(--mut);max-width:52ch;margin:10px 0 0}
.job{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px}
.job:hover{border-color:var(--acc)}
.jt{display:block;font-weight:500;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:10px 18px;font-weight:500}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:14px}
.link{background:none;border:0;color:var(--acc);padding:0;margin-bottom:14px;font-size:15px}
.pill{display:inline-block;font-size:13px;padding:1px 10px;border-radius:99px;background:var(--accbg);color:var(--acc)}
.pill.p{background:var(--warnbg);color:var(--warn)}
ul.req{margin:8px 0 0;padding-inline-start:20px}
label.f{display:block;font-weight:500;margin:16px 0 6px}
input[type=text],input[type=date],textarea,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
select{background:var(--bg)}
textarea{min-height:84px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:4px 0}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.err{color:var(--dang);font-size:14px;margin-top:6px;min-height:0}
.hint{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.stat b{display:block;font-size:30px;font-weight:500;line-height:1.2}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .n{font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.ok{text-align:center;padding:36px 20px}
.tick{width:48px;height:48px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;margin:0 auto 12px;font-size:24px}
.nav{display:flex;gap:4px 18px;align-items:center;flex-wrap:wrap}
.nav a,.nav summary{color:var(--ink);text-decoration:none;font-size:15px;cursor:pointer;list-style:none;padding:4px 0}
.nav summary::-webkit-details-marker{display:none}
.nav a:hover,.nav summary:hover{color:var(--acc)}
.dd{position:relative}
.dd .menu{position:absolute;inset-inline-start:0;top:100%;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:5}
.dd .menu button{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 10px;border-radius:6px}
.dd .menu button:hover{background:var(--accbg)}
.band{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:36px 28px;margin-top:20px}
.band p{color:var(--mut);max-width:52ch;margin:10px 0 0}
.band input{background:var(--bg)}
.sr{display:flex;gap:8px;margin-top:18px;max-width:520px}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.vals .card{margin:0}.vals h3{margin-bottom:6px}.vals p{margin:0;color:var(--mut);font-size:15px}
.foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.nav a.cur{color:var(--acc);font-weight:500}
.snav{padding:8px 0;border-bottom:1px solid var(--line)}
.eb{color:var(--acc);font-size:13px;letter-spacing:.04em;margin-bottom:6px}
em{font-style:italic;color:var(--acc)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--soft:#111821;--card:#151c26;--ink:#F1EEE7;--mut:#9BA4AF;--line:#242d39;--acc:#D2B47A;--accbg:#2B2515;--onacc:#15110A;--warn:#AEB6C0;--warnbg:#222a35;--dang:#F09595;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--soft:#111821;--card:#151c26;--ink:#F1EEE7;--mut:#9BA4AF;--line:#242d39;--acc:#D2B47A;--accbg:#2B2515;--onacc:#15110A;--warn:#AEB6C0;--warnbg:#222a35;--dang:#F09595;color-scheme:dark}
.seg.tiny button{padding:6px 9px;line-height:0}
</style>
</head>

  const j=cur;
  return `<button class="link" onclick="page='list';render()">&larr; ${T('back')}</button><div class="card"><h1 style="font-size:28px">${esc(tx(j.t))}</h1>
  <div class="meta"><span>${esc(tx(j.dept))}</span><span>${esc(tx(j.fa))}</span><span>${esc(tx(j.loc))}</span><span>${esc(tx(j.type))}, ${esc(tx(j.wm))}</span></div>
  <p>${esc(tx(j.d))}</p><h3>${T('reqs')}</h3><ul class="req">${tx(j.req).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
  <p style="margin-top:20px"><button class="btn" onclick="page='apply';msg={};render()">${T('applyNow')}</button></p></div>`;
}
function applyPage(){
  const j=cur;
  const head=`<button class="link" onclick="page='job';render()">&larr; ${esc(tx(j.t))}</button>`;
  if(!user)return head+`<div class="card ok"><h2 style="margin:0 0 6px">${T('signinT')}</h2><p class="hint">${T('signinS')}</p><button class="btn" onclick="user={name:'Sara Ahmed',email:'sara.ahmed@gmail.com'};render()">${T('google')}</button></div>`;
  return head+`<div class="card"><h2 style="margin:0 0 4px">${esc(tx(j.t))}</h2>
  <p class="hint">${T('signedAs')} ${esc(user.email)} <button class="link" style="margin:0 8px" onclick="user=null;render()">${T('signout')}</button></p>
  <h3 style="margin-top:20px">${T('pdT')}</h3><div class="grid2">
  ${fg('an',T('fName'),`<input type="text" id="an" autocomplete="name" value="${esc(user.name)}">`)}
  ${fg('ag',T('fGender'),`<select id="ag">${so([['M',T('gM')],['F',T('gF')],['N',T('gN')]])}</select>`)}
  ${fg('ae',T('fEmail'),`<input type="text" id="ae" autocomplete="email" inputmode="email" value="${esc(user.email)}">`)}
  ${fg('acc',T('fCC'),`<select id="acc">${so(CC.map(c=>[c,cn(c)+' +'+DIAL[c]]),'QA')}</select>`)}
  ${fg('am',T('fMob'),`<input type="text" id="am" autocomplete="tel-national" inputmode="tel" dir="ltr">`)}
  ${fg('ares',T('fRes'),`<select id="ares">${so(CC.map(c=>[c,cn(c)]))}</select>`)}
  ${fg('adob',T('fDob'),`<input type="date" id="adob" autocomplete="bday">`)}
  ${fg('anat',T('fNat'),`<select id="anat">${so(CC.map(c=>[c,cn(c)]))}</select>`)}
  ${fg('arel',T('fRel'),`<select id="arel">${so([['IS',T('rIs')],['CH',T('rCh')],['HI',T('rHi')],['BU',T('rBu')],['OT',T('rOt')],['NO',T('rNo')]])}</select>`)}
  ${fg('aloc',T('fCur'),`<input type="text" id="aloc" placeholder="${T('fCurPh')}">`)}
  </div>
  <label class="f" style="margin-top:20px">${T('langsQ')}</label>${['ar','en','ot'].map(c=>`<label class="chk"><input type="checkbox" name="lg" value="${c}"${c=='en'?' checked':''}>${lname(c)}</label>`).join('')}
  <label class="f" for="cvf">${T('cv')}</label><input type="file" id="cvf" accept=".pdf,.docx"><div class="hint">${T('cvHint')}</div><div class="err" id="e-cv"></div>
  ${j.q?`<label class="f" for="ans">${T('screen')}: ${esc(tx(j.q))}</label><textarea id="ans"></textarea><div class="err" id="e-ans"></div>`:''}
  <label class="chk" style="margin-top:16px"><input type="checkbox" id="cons">${T('consent')}</label><div class="err" id="e-cons"></div>
  <p><button class="btn" onclick="submitApp()">${T('submit')}</button></p></div>`;
}
function submitApp(){
  const f=$('cvf').files[0],j=cur;let bad=false;
  const set=(id,m)=>{$(id).textContent=m;if(m)bad=true};
  const g=id=>$(id).value.trim();
  ['an','ag','acc','ares','anat','arel','aloc'].forEach(id=>set('e-'+id,g(id)?'':T('errField')));
  set('e-ae',/^\S+@\S+\.\S+$/.test(g('ae'))?'':T('tnErr'));
  set('e-am',/^\d{6,15}$/.test(g('am').replace(/[\s-]/g,''))?'':T('errPhoneNo'));
  const d=new Date(g('adob')),age=(Date.now()-d)/31557600000;
  set('e-adob',g('adob')&&age>=16&&age<90?'':T('errDob'));
  let m='';
  if(!f)m=T('errCv');else if(!/\.(pdf|docx)$/i.test(f.name))m=T('errType');else if(f.size>5*1024*1024)m=T('errSize');
  set('e-cv',m);
  if(j.q)set('e-ans',$('ans').value.trim()?'':T('errAns'));
  set('e-cons',$('cons').checked?'':T('errConsent'));
  if(bad)return;
  const langs=[...document.querySelectorAll('input[name=lg]:checked')].map(i=>i.value);
  apps.push({j:j.id,acct:user.email,name:g('an'),email:g('ae'),gender:g('ag'),phone:'+'+DIAL[g('acc')]+g('am').replace(/[\s-]/g,''),res:g('ares'),dob:g('adob'),nat:g('anat'),rel:g('arel'),loc:g('aloc'),langs,file:f.name,ans:j.q?$('ans').value.trim():''});
  page='done';render();scrollTo(0,0);
}

function hr(){
  const a=jobs.filter(j=>j.status=='active').length,p=jobs.length-a;
  return `<h2 style="margin-top:24px">${T('dash')}</h2><div class="stats"><div class="stat"><b>${a}</b>${T('sActive')}</div><div class="stat"><b>${p}</b>${T('sPaused')}</div><div class="stat"><b>${apps.length}</b>${T('sCvs')}</div></div>
  <h2>${T('jobs')}</h2><div class="card" style="padding:6px 20px">${jobs.map(j=>`<div class="row"><div><span class="n">${esc(tx(j.t))}</span> <span class="pill${j.status=='paused'?' p':''}">${T(j.status)}</span><div class="hint">${apps.filter(x=>x.j==j.id).length} ${T('cvs')}</div></div>
  <button class="btn ghost sm" onclick="toggle(${j.id})">${j.status=='active'?T('pause'):T('publish')}</button></div>`).join('')}</div>
  <h2>${T('post')}</h2><div class="card"><div class="grid2"><div><label class="f" for="pt">${T('fTitle')}</label><input type="text" id="pt"><div class="err" id="e-pt"></div></div><div><label class="f" for="pd">${T('fDept')}</label><select id="pd">${CO.map((c,i)=>`<option value="${i}">${esc(tx(c))}</option>`).join('')}</select></div><div><label class="f" for="pf">${T('fFa')}</label><select id="pf">${FA.map((c,i)=>`<option value="${i}">${esc(tx(c))}</option>`).join('')}</select></div><div><label class="f" for="pj">${T('fType')}</label><div class="grid2" style="gap:0 8px"><select id="pj" aria-label="${T('fType')}">${ET.map((c,i)=>`<option value="${i}">${esc(tx(c))}</option>`).join('')}</select><select id="pw" aria-label="${T('fType')}">${WM.map((c,i)=>`<option value="${i}">${esc(tx(c))}</option>`).join('')}</select></div></div><div><label class="f" for="pl">${T('fLoc')}</label><input type="text" id="pl"></div></div>
  <label class="f" for="pr">${T('fReq')}</label><textarea id="pr"></textarea><label class="f" for="pq">${T('fQ')}</label><input type="text" id="pq">
  <p><button class="btn" onclick="postJob()">${T('postBtn')}</button> <span class="hint">${T('postHint')}</span></p></div>
  <h2>${T('cvDb')}</h2><input type="text" id="q" placeholder="${T('search')}" oninput="cvList()"><div class="card" id="cvl" style="margin-top:12px;padding:6px 20px"></div>`;
}
function toggle(id){const j=jobs.find(x=>x.id==id);j.status=j.status=='active'?'paused':'active';render()}
function postJob(){
  const v=id=>$(id).value.trim();
  if(!v('pt')){$('e-pt').textContent=T('errJob');return}
  const s=x=>B(x,x);
  jobs.unshift({id:nextId++,status:'active',t:s(v('pt')),dept:CO[+$('pd').value],loc:s(v('pl')||'-'),type:ET[+$('pj').value],wm:WM[+$('pw').value],fa:FA[+$('pf').value],d:s(v('pr')),req:B([],[]),q:v('pq')?s(v('pq')):null});
  render();
}
function cvList(){
  const q=($('q')?$('q').value:'').toLowerCase();
  const rows=apps.filter(a=>(a.name+' '+jt(a.j)+' '+a.langs.map(lname).join(' ')).toLowerCase().includes(q));
  $('cvl').innerHTML=rows.length?rows.map(a=>`<div class="row"><div><span class="n">${esc(a.name)}</span><div class="hint">${esc(jt(a.j))}</div>${a.phone?`<div class="hint">${esc(a.phone)}${a.nat?', '+esc(cn(a.nat)):''}</div>`:''}</div><div class="hint">${a.langs.map(lname).join(', ')} &nbsp; ${esc(a.file)}</div></div>`).join(''):`<p class="hint">${T('noCv')}</p>`;
}
render();
</script>
</body>
</html>
